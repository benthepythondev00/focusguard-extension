<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Timer circle outer -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="white" stroke-width="6" opacity="0.3"/>
  
  <!-- Timer progress arc (about 75% complete) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="white" stroke-width="6" 
    stroke-linecap="round"
    stroke-dasharray="179"
    stroke-dashoffset="45"
    transform="rotate(-90 64 64)"/>
  
  <!-- Brain/Focus icon in center -->
  <g transform="translate(44, 44)" fill="white">
    <path d="M20 0C12.3 0 6 5.4 6 12c0 2.8 1.1 5.4 3 7.5V36h2V20.5c0-.4-.1-.8-.4-1.1C8.9 17.8 8 15.5 8 13c0-5.5 5.4-10 12-10s12 4.5 12 10c0 2.5-.9 4.8-2.6 6.4-.3.3-.4.7-.4 1.1V36h2V19.5c1.9-2.1 3-4.7 3-7.5C34 5.4 27.7 0 20 0z"/>
    <circle cx="20" cy="16" r="4"/>
  </g>
</svg>
